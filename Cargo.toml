[workspace]
resolver = "2"
members = [
    "package/backend",
    "package/derive",
    "package/schema",
    "package/ui",

    # platform
    "package/desktop",
    "package/mobile",
    "package/web",
]

[workspace.dependencies]
# Workspace
backend = { path = "package/backend" }
derive = { path = "package/derive" }
schema = { path = "package/schema" }
ui = { path = "package/ui" }

# External
chrono = { version = "0.4.42", features = ["serde"] }
# qdrant-client = { version = "1.15.0", default-features = false }
# sqlx = { version = "0.8.6", features = ["chrono", "runtime-tokio", "sqlite"] }
surrealdb = { version = "2.3.10", features = ["kv-mem"] }
tokio = { version = "1.48.0", features = ["full"] }

cfg-if = "1.0.3"
cuid2 = "0.1.4"
dioxus = "0.7.3"
eyre = "0.6.12"
# fastembed = "5.2.0"
include_dir = "0.7.4"
once_cell = "1.21.3"
serde = "1.0.228"
serde_json = "1.0.145"
surrealdb-migrations = "2.3.0"
# Use after either wasm in dioxus is compatible with rustc 1.89.0
# tailwind-rs-dioxus = "*"
thiserror = "2.0.17"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
